buildscript {
    repositories {
        mavenCentral()
        maven {
            name 'jitpack'
            url 'https://jitpack.io'
        }
        maven {
            name 'forge'
            url 'https://maven.minecraftforge.net/'
        }
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
        classpath 'com.github.MJaroslav:Bon2Gradle:0.5.+'
    }
}

repositories {
    maven {
        name 'jitpack'
        url 'https://jitpack.io'
    }
    maven {
        name "CurseMaven"
        url 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name "GTNH Maven"
        url "https://nexus.gtnewhorizons.com/repository/public/"
        content {
            includeGroup "com.gtnewhorizons"
        }
    }
    mavenCentral()
}

apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'forge'
apply plugin: 'maven-publish'
apply plugin: 'bon2gradle'

idea.module.inheritOutputDirs = true

def buildprop = new Properties()
file("build.properties").withInputStream { buildprop.load(it) }

version = buildprop.version
group = buildprop.group
archivesBaseName = project.name

minecraft {
    version = "${buildprop.game_version}-${buildprop.forge_version}-${buildprop.game_version}"
    runDir = buildprop.run_dir
    replace '@VERSION@', project.version
}

dependencies {
    // Compile and development libraries
    compileOnly libs.annotation
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    implementation libs.unimixins
    annotationProcessor libs.unimixins
    implementation bon2.deobf(libs.unimixinsMixinBooterLegacy.get())
    annotationProcessor libs.jabel

    // Mods utility
    implementation variantOf(libs.codeChickenCore) { classifier("dev") }
    implementation variantOf(libs.notEnoughItems) { classifier("dev") }
    implementation bon2.deobf(libs.waila.get())

    // Mods compatability
    implementation bon2.deobf(libs.appliedEnergistics2.get())
    implementation bon2.deobf(libs.extraCells2.get())
    implementation libs.jabba
    implementation bon2.deobf(libs.baubles.get())
    implementation bon2.deobf(libs.thaumcraft.get())
}

configure([tasks.compileJava, tasks.compileTestJava, tasks.compileApiJava]) {
    sourceCompatibility = 16 // for the IDE support
    options.release = 8
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(16)
    }
}

tasks.register('devJar', Jar) {
    archiveClassifier = 'dev'
    manifest { from project.tasks.jar.manifest }
    from sourceSets.main.output
}

artifacts {
    archives devJar
}

java {
    withSourcesJar()
}

if (buildprop.coremod.toBoolean()) {
    runClient {
        args += ["--tweakClass", "org.spongepowered.asm.launch.MixinTweaker"]
    }

    runServer {
        args += ["--tweakClass", "org.spongepowered.asm.launch.MixinTweaker"]
    }
}

def outSrgFile = "${tasks.compileJava.temporaryDir}/outSrg.srg"
def outRefMapFile = "${tasks.compileJava.temporaryDir}/mixin.${project.name.replace(" ", "").toLowerCase()}.refmap.json"

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    inputs.property 'description', buildprop.description
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version,
                'description': buildprop.description.replace("\"", "\\\"")
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

tasks.withType(Jar)*.doFirst {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    includeEmptyDirs = false
    if ((name == "jar" || name == "devJar" || name == "sourcesJar")) {
        if (buildprop.coremod.toBoolean())
            manifest {
                // Don't forged about -Dfml.coreMods.load
                def modName = project.name.replace(" ", "")
                modName = modName.substring(0, 1).toUpperCase() + modName.substring(1)
                attributes "FMLCorePlugin": "${project.group}.${modName.toLowerCase()}.asm.${modName}Plugin"
                attributes "FMLCorePluginContainsFMLMod": "true"
            }
        from outRefMapFile
    }
}

if (buildprop.coremod.toBoolean()) {
    tasks.compileJava.options.compilerArgs += ["-AreobfSrgFile=${tasks.reobf.srg}", "-AoutSrgFile=${outSrgFile}", "-AoutRefMapFile=${outRefMapFile}"]
}

reobf {
    addExtraSrgFile outSrgFile
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
            pom {
                name = rootProject.name
                description = buildprop.description.toString()
            }
        }
    }
    repositories {
        maven {
            name = "JitCI" // JitCI internal repository with fallback
            def deployDir = "DEPLOY_DIR"
            url = System.getenv(deployDir) == null ? layout.buildDirectory.dir("deploy") : System.getenv(deployDir)
        }
    }
}
